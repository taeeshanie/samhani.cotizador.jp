<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Samahani Cotizador</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 0 15px 150px;

      font-family: "Yeseva One", serif;

      background-image: url("fondo.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    /* =========================
       DECORACIÓN
    ========================= */

    .decoracion {
      width: 100%;
      max-width: 1000px;
      margin-bottom: 10px;
    }

    .decoracion img {
      display: block;
      width: 100%;
      height: auto;
    }


    /* =========================
       CONTENEDOR MANZANA
    ========================= */

    .apple-container {
      position: relative;

      width: min(96vw, 1100px);
      aspect-ratio: 1.12 / 1;

      margin-top: 10px;

      display: flex;
      justify-content: center;
      align-items: center;

      transition: height 0.35s ease;
    }


    /* SVG */

    .apple-frame {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1;

      pointer-events: none;

      overflow: visible;
    }


    /* =========================
       COTIZADOR
    ========================= */

    .cotizador {
      position: relative;

      z-index: 2;

      width: 63%;

      margin-top: 7%;

      padding: 40px 10px 45px;

      background: transparent;

      text-align: center;
    }


    /* =========================
       INPUT
    ========================= */

    .input-container {
      position: relative;
      width: 100%;
    }

    .input-usd {
      width: 100%;

      padding: 25px 75px 25px 28px;

      border: 3px solid #9f2924;
      border-radius: 22px;

      background: rgba(255,255,255,0.75);

      color: #555;

      font-family: "Yeseva One", serif;
      font-size: 30px;

      outline: none;
    }

    .input-usd::placeholder {
      color: #8c8c8c;
      opacity: 1;
    }

    .input-usd:focus {
      border-color: #5b8917;

      box-shadow:
        0 0 0 5px
        rgba(91,137,23,0.12);
    }


    /* SIGNO $ */

    .simbolo {
      position: absolute;

      top: 50%;
      right: 28px;

      transform: translateY(-50%);

      color: #96241f;

      font-size: 45px;

      pointer-events: none;
    }


    /* =========================
       BOTÓN
    ========================= */

    button {
      width: 100%;

      margin-top: 28px;
      padding: 25px;

      border: none;
      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #5d9118,
          #3f700b
        );

      color: white;

      font-family: "Yeseva One", serif;
      font-size: 34px;

      cursor: pointer;

      box-shadow:
        0 7px 0 #315908,
        inset 0 1px 2px rgba(255,255,255,0.18);

      transition: 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(4px);

      box-shadow:
        0 3px 0 #315908;
    }


    /* =========================
       SEPARADOR
    ========================= */

    .separador {
      width: 100%;

      margin: 42px 0 35px;

      border-top: 2px dotted #a12b25;
    }


    /* =========================
       RESULTADO
    ========================= */

    .resultado {
      display: none;

      width: 100%;
      min-height: 170px;

      padding: 30px 20px;

      border: 2px dashed #a52b25;
      border-radius: 28px;

      background:
        rgba(255,255,255,0.22);

      color: #94251f;

      font-size: 56px;

      text-align: center;
      align-content: center;

      word-break: break-word;
    }


    /* =========================
       ERROR
    ========================= */

    .error {
      display: none;

      margin-top: 22px;

      color: #a0201b;

      font-family: Arial, sans-serif;

      font-size: 17px;
      font-weight: bold;

      text-align: center;
    }


    /* =========================
       TEXTO DEBAJO DE LA MANZANA
    ========================= */

    .aviso {
      display: none;

      width: min(90vw, 700px);

      margin: 20px auto 0;

      padding: 0 20px;

      color: #8f3029;

      font-family: Arial, sans-serif;

      font-size: 16px;
      font-weight: bold;

      line-height: 1.55;

      text-align: center;
    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 700px) {

      body {
        padding: 0 5px 100px;
      }

      .apple-container {

        width: 100vw;

        /* Altura inicial */

        aspect-ratio: auto;

        height: 620px;

        margin-top: 0;
      }


      /* Cuando aparece el resultado,
         la manzana crece */

      .apple-container.cotizado {
        height: 760px;
      }


      .cotizador {

        width: 64%;

        margin-top: 4%;

        padding: 35px 0 30px;
      }


      .input-usd {

        padding:
          18px
          52px
          18px
          16px;

        font-size: 20px;

        border-radius: 18px;
      }


      .simbolo {

        right: 16px;

        font-size: 31px;
      }


      button {

        margin-top: 20px;

        padding: 18px;

        font-size: 23px;

        border-radius: 18px;
      }


      .separador {

        margin:
          28px
          0
          25px;
      }


      .resultado {

        min-height: 125px;

        padding: 20px 10px;

        font-size: 37px;

        border-radius: 20px;
      }


      .aviso {

        width: 88vw;

        margin-top: 18px;

        padding: 0;

        font-size: 12px;

        line-height: 1.55;
      }


      .error {
        font-size: 12px;
      }

    }

  </style>

</head>

<body>


  <!-- DECORACIÓN -->

  <div class="decoracion">

    <img
      src="decoracion.png"
      alt="Samahani Cotizador"
    >

  </div>



  <!-- MANZANA -->

  <div
    class="apple-container"
    id="appleContainer"
  >


    <svg
      class="apple-frame"

      viewBox="0 0 1000 900"

      xmlns="http://www.w3.org/2000/svg"

      preserveAspectRatio="none"
    >

      <defs>

        <linearGradient
          id="redApple"
          x1="0"
          y1="0"
          x2="0"
          y2="1"
        >

          <stop
            offset="0%"
            stop-color="#f2352f"
          />

          <stop
            offset="45%"
            stop-color="#df1712"
          />

          <stop
            offset="100%"
            stop-color="#c5100d"
          />

        </linearGradient>


        <radialGradient
          id="creamInside"
          cx="50%"
          cy="45%"
          r="70%"
        >

          <stop
            offset="0%"
            stop-color="#fffdf5"
          />

          <stop
            offset="70%"
            stop-color="#fff8e6"
          />

          <stop
            offset="100%"
            stop-color="#f6e8c9"
          />

        </radialGradient>


        <linearGradient
          id="greenLeaf"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >

          <stop
            offset="0%"
            stop-color="#9bc943"
          />

          <stop
            offset="100%"
            stop-color="#477b11"
          />

        </linearGradient>


        <filter
          id="shadow"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
        >

          <feDropShadow
            dx="0"
            dy="12"
            stdDeviation="12"
            flood-color="#5f211b"
            flood-opacity="0.25"
          />

        </filter>

      </defs>


      <!-- CUERPO -->

      <path

        d="
          M 500 180

          C 430 125,
            355 125,
            275 155

          C 155 200,
            90 330,
            110 500

          C 125 645,
            200 770,
            330 810

          C 400 832,
            455 802,
            500 790

          C 545 802,
            600 832,
            670 810

          C 800 770,
            875 645,
            890 500

          C 910 330,
            845 200,
            725 155

          C 645 125,
            570 125,
            500 180

          Z
        "

        fill="url(#creamInside)"

        stroke="url(#redApple)"

        stroke-width="48"

        stroke-linejoin="round"

        filter="url(#shadow)"
      />


      <!-- TALLO -->

      <path

        d="
          M 500 160
          C 495 105,
            510 70,
            545 32
        "

        fill="none"

        stroke="#6c3515"

        stroke-width="28"

        stroke-linecap="round"
      />


      <!-- HOJA -->

      <path

        d="
          M 525 105

          C 590 22,
            735 20,
            790 75

          C 715 140,
            605 155,
            525 105

          Z
        "

        fill="url(#greenLeaf)"

        stroke="#426f10"

        stroke-width="8"
      />


      <path

        d="
          M 535 105

          C 610 95,
            675 95,
            760 78
        "

        fill="none"

        stroke="#426f10"

        stroke-width="6"

        stroke-linecap="round"
      />

    </svg>



    <!-- COTIZADOR -->

    <main class="cotizador">

      <div class="input-container">

        <input

          type="number"

          id="precioUSD"

          class="input-usd"

          placeholder="Precio en USD"

          min="0"

          step="0.01"

        >

        <span class="simbolo">$</span>

      </div>


      <button
        type="button"
        onclick="cotizar()"
      >
        COTIZAR
      </button>


      <div class="separador"></div>


      <div
        id="resultado"
        class="resultado"
      ></div>


      <div
        id="error"
        class="error"
      >
        Ingresá un precio válido.
      </div>

    </main>

  </div>



  <!-- TEXTO FUERA DE LA MANZANA -->

  <div
    id="aviso"
    class="aviso"
  >

    Los precios que se muestran solo incluyen fees.
    El envío a casilla japonesa se cobra por aparte,
    ya que depende del peso y la cantidad de items
    que entren en el envío.

  </div>



  <script>

    function cotizar() {

      const precio = parseFloat(
        document
          .getElementById("precioUSD")
          .value
      );

      const fees = 3.50;
      const dolar = 1600;

      const resultado =
        document.getElementById("resultado");

      const aviso =
        document.getElementById("aviso");

      const error =
        document.getElementById("error");

      const appleContainer =
        document.getElementById("appleContainer");


      if (isNaN(precio) || precio <= 0) {

        resultado.style.display = "none";

        aviso.style.display = "none";

        error.style.display = "block";

        appleContainer.classList.remove(
          "cotizado"
        );

        return;
      }


      error.style.display = "none";


      const totalUSD =
        precio + fees;

      const totalARS =
        totalUSD * dolar;


      resultado.innerHTML =
        "$ " +
        totalARS.toLocaleString(
          "es-AR",
          {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
          }
        );


      resultado.style.display = "block";

      aviso.style.display = "block";


      /* Hace crecer la manzana */

      appleContainer.classList.add(
        "cotizado"
      );

    }


    document
      .getElementById("precioUSD")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            cotizar();
          }

        }
      );

  </script>

</body>
</html>
